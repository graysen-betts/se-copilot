[project]
name = "se-copilot"
version = "0.1.0"
description = "Autonomous SE Co-Pilot — generates SE-owned materials across Atlan sales stages S2-S6"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.52.0",
    "python-dotenv>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
se-copilot = "se_copilot.cli:main"
